<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basic Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
        }

        a {
            text-decoration: none;
        }

        .hero {
            padding: 4rem 0 3rem;
        }

        .hero-title {
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .calculator-wrapper {
            max-width: 430px;
            margin: 0 auto;
        }

        .calculator-card {
            border-color: var(--bs-border-color) !important;
        }

        .calculator-display {
            min-height: 120px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: right;
            background: var(--bs-tertiary-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .calculator-expression {
            min-height: 24px;
            color: var(--bs-secondary-color);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calculator-result {
            margin-top: 0.25rem;
            color: var(--bs-body-color);
            font-size: 2.25rem;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calculator-keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .calculator-key {
            min-height: 64px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .calculator-key.operator {
            font-weight: 600;
        }

        .calculator-key.equal {
            font-weight: 600;
        }

        .calculator-key.zero {
            grid-column: span 2;
        }

        footer {
            margin-top: 6rem;
        }

        @media (max-width: 575.98px) {
            .hero {
                padding: 3rem 0 2rem;
            }

            .calculator-result {
                font-size: 2rem;
            }

            .calculator-key {
                min-height: 58px;
            }
        }
    </style>

</head>

<body data-bs-theme="dark">

    <main>

        <!-- Hero -->
        <section class="hero">
            <div class="container">

                <a href="../index.html" class="text-secondary small">
                    ← Back to Calculator Collection
                </a>

                <h1 class="hero-title display-5 mt-4">
                    Basic Calculator
                </h1>

            </div>
        </section>

        <!-- Calculator -->
        <section>
            <div class="container">

                <div class="calculator-wrapper">

                    <div class="card calculator-card">
                        <div class="card-body p-4">

                            <!-- Display -->
                            <div class="calculator-display mb-4">
                                <div id="expression" class="calculator-expression">
                                    &nbsp;
                                </div>

                                <div id="result" class="calculator-result">0</div>
                            </div>

                            <!-- Keypad -->
                            <div class="calculator-keypad">

                                <!-- Row 1 -->
                                <button type="button" class="btn btn-outline-secondary calculator-key"
                                    data-action="clear">
                                    AC
                                </button>

                                <button type="button" class="btn btn-outline-secondary calculator-key"
                                    data-action="delete">
                                    DEL
                                </button>

                                <button type="button" class="btn btn-outline-secondary calculator-key operator"
                                    data-value="%">
                                    %
                                </button>

                                <button type="button" class="btn btn-outline-primary calculator-key operator"
                                    data-value="/">
                                    ÷
                                </button>

                                <!-- Row 2 -->
                                <button type="button" class="btn btn-secondary calculator-key" data-value="7">
                                    7
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value="8">
                                    8
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value="9">
                                    9
                                </button>

                                <button type="button" class="btn btn-outline-primary calculator-key operator"
                                    data-value="*">
                                    ×
                                </button>

                                <!-- Row 3 -->
                                <button type="button" class="btn btn-secondary calculator-key" data-value="4">
                                    4
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value="5">
                                    5
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value="6">
                                    6
                                </button>

                                <button type="button" class="btn btn-outline-primary calculator-key operator"
                                    data-value="-">
                                    −
                                </button>

                                <!-- Row 4 -->
                                <button type="button" class="btn btn-secondary calculator-key" data-value="1">
                                    1
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value="2">
                                    2
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value="3">
                                    3
                                </button>

                                <button type="button" class="btn btn-outline-primary calculator-key operator"
                                    data-value="+">
                                    +
                                </button>

                                <!-- Row 5 -->
                                <button type="button" class="btn btn-secondary calculator-key zero" data-value="0">
                                    0
                                </button>

                                <button type="button" class="btn btn-secondary calculator-key" data-value=".">
                                    .
                                </button>

                                <button type="button" class="btn btn-primary calculator-key equal"
                                    data-action="calculate">
                                    =
                                </button>

                            </div>

                        </div>
                    </div>

                </div>

            </div>

    </main>

    <!-- Footer -->
    <footer class="border-top">
        <div class="container py-4">
            <div class="d-flex flex-column flex-sm-row
                    justify-content-between
                    align-items-sm-center gap-2">

                <span class="text-secondary small">
                    © 2026 Calc Collection
                </span>

            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../scripts/basic-calculator.js"></script>

</body>

</html>
