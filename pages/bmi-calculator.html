<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
        }

        a {
            text-decoration: none;
        }

        .hero {
            padding: 4rem 0 3rem;
        }

        .hero-title {
            font-weight: 700;
            letter-spacing: -0.03em;
        }



        .calculator-wrapper {
            max-width: 920px;
            margin: 0 auto;
        }

        .calculator-card {
            border-color: var(--bs-border-color) !important;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-control,
        .btn,
        .result-card {
            border-radius: 10px;
        }

        .form-control {
            min-height: 48px;
        }

        .result-card {
            display: flex;
            min-height: 100%;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            background: var(--bs-tertiary-bg);
            border: 1px solid var(--bs-border-color);
        }

        .result-value {
            font-size: clamp(3rem, 7vw, 4.5rem);
            line-height: 1.1;
            font-weight: 600;
            letter-spacing: -0.05em;
        }

        .result-category {
            display: inline-block;
            align-self: flex-start;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--bs-border-color);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        footer {
            margin-top: 6rem;
        }

        @media (max-width: 575.98px) {
            .hero {
                padding: 3rem 0 2rem;
            }

            .result-card {
                padding: 1.5rem;
            }
        }
    </style>

</head>

<body data-bs-theme="dark">

    <main>

        <!-- Hero -->
        <section class="hero">
            <div class="container">

                <a href="../index.html" class="text-secondary small">
                    ← Back to Calculator Collection
                </a>

                <h1 class="hero-title display-5 mt-4">
                    BMI Calculator
                </h1>

            </div>
        </section>

        <section>

            <div class="container">
                <div class="calculator-wrapper">
                    <div class="row g-4 align-items-stretch">

                        <!-- Input -->
                        <div class="col-12 col-lg-5">
                            <div class="card calculator-card h-100">
                                <div class="card-body p-4">
                                    <h5 class="fw-semibold mb-4">Your measurements</h5>

                                    <form id="bmiForm" novalidate>
                                        <div class="mb-3">
                                            <label for="heightCm" class="form-label">Height (cm)</label>
                                            <input type="number" class="form-control" id="heightCm" min="50" max="300"
                                                step="any" value="170" inputmode="decimal" required>
                                        </div>

                                        <div class="mb-4">
                                            <label for="weightKg" class="form-label">Weight (kg)</label>
                                            <input type="number" class="form-control" id="weightKg" min="1" max="1000"
                                                step="any" value="65" inputmode="decimal" required>
                                        </div>

                                        <button type="button" id="calculate" class="btn btn-primary w-100">Calculate
                                            BMI</button>
                                    </form>

                                </div>
                            </div>
                        </div>

                        <!-- Result -->
                        <div class="col-12 col-lg-7">
                            <section class="result-card" aria-labelledby="resultHeading" aria-live="polite">
                                <p class="text-secondary small mb-2" id="resultHeading">Your Body Mass Index</p>
                                <div class="result-value mb-3" id="bmiResult">22.5</div>
                                <div class="result-category mb-4" id="bmiCategory">Normal weight</div>
                                <p class="mb-1">Healthy BMI range: <strong>18.5–24.9</strong></p>
                            </section>
                        </div>

                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="border-top">
        <div class="container py-4">
            <div class="d-flex flex-column flex-sm-row
                    justify-content-between
                    align-items-sm-center gap-2">

                <span class="text-secondary small">
                    © 2026 Calc Collection
                </span>

            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../scripts/age-calculator.js"></script>

</body>

</html>
