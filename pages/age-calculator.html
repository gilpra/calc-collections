<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basic Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
        }

        a {
            text-decoration: none;
        }

        .hero {
            padding: 4rem 0 3rem;
        }

        .hero-title {
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        footer {
            margin-top: 6rem;
        }

        @media (max-width: 575.98px) {
            .hero {
                padding: 3rem 0 2rem;
            }
        }
    </style>

</head>

<body data-bs-theme="dark">

    <main>

        <!-- Hero -->
        <section class="hero">
            <div class="container">

                <a href="../index.html" class="text-secondary small">
                    ← Back to Calculator Collection
                </a>

                <h1 class="hero-title display-5 mt-4">
                    Age Calculator
                </h1>

            </div>
        </section>

        <!-- Calculator -->
        <section>
            <div class="container">

                <div class="calculator-wrapper">
                    <div class="row g-4 align-items-stretch">

                        <!-- Input -->
                        <div class="col-12 col-lg-5">
                            <div class="card calculator-card h-100">
                                <div class="card-body p-4">
                                    <h5 class="fw-semibold mb-4">Enter dates</h5>

                                    <form id="ageForm">
                                        <div class="mb-3">
                                            <label for="birthDate" class="form-label">Date of birth</label>
                                            <input type="date" class="form-control" id="birthDate" required>
                                        </div>

                                        <div class="mb-4">
                                            <label for="asOfDate" class="form-label">Calculate age on</label>
                                            <input type="date" class="form-control" id="asOfDate" required>
                                        </div>

                                        <button type="submit" class="btn btn-primary w-100">
                                            Calculate age
                                        </button>
                                    </form>

                                    <div id="ageError" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-top">
        <div class="container py-4">
            <div class="d-flex flex-column flex-sm-row
                    justify-content-between
                    align-items-sm-center gap-2">

                <span class="text-secondary small">
                    © 2026 Calc Collection
                </span>

            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../scripts/basic-calculator.js"></script>

</body>

</html>
